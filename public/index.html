<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1565c0">
<link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon-192.png"><link rel="apple-touch-icon" href="/icon-192.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Order Groceries Online</title>
<link rel="stylesheet" href="style.css">
<style>
.hd{touch-action:none;animation:down .45s cubic-bezier(.2,.8,.2,1)}
.wrap{max-width:1100px;margin:0 auto;padding:12px 14px 110px}
.car{position:relative;border-radius:20px;overflow:hidden;margin-bottom:10px;box-shadow:var(--sh)}
.cs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.cs::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;scroll-snap-align:start;padding:22px 20px 34px;color:#fff;min-height:132px;position:relative;overflow:hidden}
.sl h1{margin:0 0 6px;font-size:clamp(20px,5vw,30px);max-width:75%;line-height:1.2}
.sl p{margin:0;opacity:.92;font-size:14px;max-width:75%}
.sl .em{position:absolute;right:16px;top:14px;font-size:58px;animation:float 3s ease-in-out infinite}
.s1{background:linear-gradient(135deg,var(--br),var(--br2))}
.s2{background:linear-gradient(135deg,#fb8c00,#e65100)}
.s3{background:linear-gradient(135deg,#00897b,#00574b)}
.dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:6px}
.dots i{width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.5);transition:all .3s}
.dots i.on{width:20px;background:#fff}
.stk{position:sticky;top:62px;z-index:15;background:var(--bg);margin:0 -14px;padding:6px 14px 0}
.tools{display:grid;grid-template-columns:1fr 130px;gap:8px;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr);gap:14px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.deals{background:linear-gradient(135deg,var(--br),var(--br2));border-radius:18px;padding:12px 10px 4px;margin-bottom:14px}
.st2{color:#fff;font-weight:700;font-size:17px;margin:0 4px 10px}
.dstrip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding:0 2px 12px;scrollbar-width:none}
.dstrip::-webkit-scrollbar{display:none}
.dstrip .pc{flex:0 0 150px;scroll-snap-align:start}
.pc{background:var(--sf);border:1px solid var(--ln);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s}
.pc:hover{transform:translateY(-3px)}.pc:active{transform:scale(.98)}
.pc.in{animation:up .4s both}
.pi{position:relative;aspect-ratio:1/1;background:var(--bg);display:grid;place-items:center;font-size:54px;overflow:hidden}
.pi img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s,transform .4s}
.pi img.ld{opacity:1}.pc:hover .pi img{transform:scale(1.07)}
.off{position:absolute;top:8px;left:8px;background:var(--rd);color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;animation:pulse 2.2s infinite}
.oos{position:absolute;inset:0;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;font-weight:700}
.pb{padding:10px;display:flex;flex-direction:column;gap:2px;flex:1}
.br{color:var(--br);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
.pb b.n{font-size:14.5px;line-height:1.25}
.pb small{color:var(--mu)}
.pr{margin-top:auto;padding-top:8px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.pr s{color:var(--mu);font-size:12px}.pr b{font-size:16px}
.add{border:1.5px solid var(--br);background:none;color:var(--br);border-radius:10px;padding:7px 12px;font-weight:800;cursor:pointer;transition:background .15s,color .15s}
.add:active{background:var(--br);color:#fff}
.q{display:flex;align-items:center;gap:7px}
.q button{width:30px;height:30px;border:0;border-radius:9px;background:var(--br);color:#fff;font-size:18px;cursor:pointer}
.q b{display:inline-block;min-width:14px;text-align:center}
.bp{animation:pop .3s}
.sk{background:linear-gradient(90deg,var(--ln) 25%,var(--bg) 50%,var(--ln) 75%);background-size:200% 100%;animation:sh 1.2s infinite linear}
.bar{position:fixed;left:12px;right:12px;bottom:12px;max-width:640px;margin:0 auto;background:var(--br);color:#fff;border-radius:16px;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:30;cursor:pointer;transform:translateY(120px);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.bar.on{transform:none}
.ci{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}
.ci img,.ci .th{width:46px;height:46px;border-radius:10px;object-fit:cover;background:var(--bg);display:grid;place-items:center;font-size:24px}
.ci .i{flex:1;font-size:14px}
.ok{text-align:center;padding:10px 0}
.dl .lg{display:flex;gap:6px;padding:0 8px 6px}
.dl .lg button{flex:1;width:auto;justify-content:center;border:1px solid var(--ln);padding:9px 4px;font-size:14px}
.dl .lg button.on{background:var(--br);color:#fff;border-color:var(--br)}
.rp{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.25;transform:scale(0);animation:rip .55s ease-out;pointer-events:none}
.fly{position:fixed;width:38px;height:38px;border-radius:50%;background:var(--sf) center/cover;display:grid;place-items:center;font-size:20px;z-index:95;box-shadow:0 4px 12px rgba(0,0,0,.3);pointer-events:none;border:2px solid #fff}
.cf{position:fixed;width:8px;height:12px;z-index:99;pointer-events:none;border-radius:2px}
@keyframes down{from{transform:translateY(-100%)}to{transform:none}}
@keyframes sh{to{background-position:-200% 0}}
@keyframes rip{to{transform:scale(1);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
</style></head>

 <button class="ib" id="mb" aria-label="Menu">☰</button><b id="ttl">Kirana Store</b>

<div class="wrap">

</div>

<div class="bar" id="bar"><div><b id="cnt">0</b><br><small id="tot">₹0</small></div><b data-i18n="view"></b></div>

<div class="sheet" id="cs"><div class="panel">

  <button class="btn s w" style="margin-top:8px" data-x data-i18n="close"></button>
 </div>
 <div id="dv" class="ok hide"><div id="tickw"></div><h2 id="dt"></h2>
  <p class="msg" data-i18n="placedMsg"></p>
  <button class="btn w" id="dn2" data-i18n="done"></button></div>
</div></div>

<div class="sheet" id="ts"><div class="panel">
 <h2 data-i18n="tTitle"></h2>
 <p class="msg" style="margin-top:-6px" data-i18n="tNote"></p>
 <div id="tr"></div>
 <button class="btn w" id="tg" style="margin-top:8px" data-i18n="refresh"></button>
 <button class="btn s w" data-x style="margin-top:8px" data-i18n="close"></button>
</div></div>

<div class="sheet" id="is"><div class="panel">
 <h2 data-i18n="iTitle"></h2><div id="ib2"></div>
 <button class="btn s w" data-x style="margin-top:12px" data-i18n="close"></button>
</div></div>

  return !q||(p.name+" "+p.brand+" "+p.category).toLowerCase().indexOf(q)>=0});

  +(p.img?'<img loading="lazy" onload="this.classList.add(\'ld\')" src="'+esc(p.img)+'" alt="'+esc(p.name)+'">':(p.emoji||"🛒"))
  +(off?'<span class="off">'+t("off",{n:off})+"</span>":"")+(p.in_stock?"":'<div class="oos">'+t("oos")+"</div>")+"</div>"
  +'<div class="pb">'+(p.brand?'<span class="br">'+esc(p.brand)+"</span>":"")+'<b class="n">'+esc(p.name)+"</b>"+(p.unit?"<small>"+esc(p.unit)+"</small>":"")

/*ZIG*/
function makeZig(){var S=60,sw=0,dir=0,ex=0,y0=0,t0=0;
 function start(x,y,t){sw=0;dir=0;ex=x;y0=y;t0=t}
 function move(x,y,t){
  if(Math.abs(y-y0)>40||t-t0>4000){start(x,y,t);return false}
  if(!dir){if(Math.abs(x-ex)>S){dir=x>ex?1:-1;ex=x}}
  else if(dir===1){if(x>ex)ex=x;else if(ex-x>S){dir=-1;sw++;ex=x}}
  else{if(x<ex)ex=x;else if(x-ex>S){dir=1;sw++;ex=x}}
  if(sw>=4){start(x,y,t);return true}
  return false}
 return{start:start,move:move}}
/*ENDZIG*/
(function(){
 var hd=document.querySelector(".hd"),z=makeZig(),pid=null,d0=0,buf="",last=0;
 function go(){try{if(navigator.vibrate)navigator.vibrate(40)}catch(e){}location.href="/owner.html"}
 function dist(q){return Math.hypot(q[0].clientX-q[1].clientX,q[0].clientY-q[1].clientY)}
 hd.addEventListener("pointerdown",function(e){if(pid!==null||(e.pointerType==="mouse"&&e.button!==0))return;pid=e.pointerId;z.start(e.clientX,e.clientY,Date.now())});
 window.addEventListener("pointermove",function(e){
  if(e.pointerId!==pid)return;
  if(e.pointerType==="mouse"&&!(e.buttons&1)){pid=null;return}
  if(z.move(e.clientX,e.clientY,Date.now())){pid=null;go()}});
 function end(e){if(e.pointerId===pid)pid=null}
 window.addEventListener("pointerup",end);window.addEventListener("pointercancel",end);
 hd.addEventListener("touchstart",function(e){if(e.touches.length===2)d0=dist(e.touches)},{passive:true});
 hd.addEventListener("touchmove",function(e){if(e.touches.length===2&&d0&&dist(e.touches)-d0>140){d0=0;go()}},{passive:true});
 document.addEventListener("keydown",function(e){
  var a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;
  if(e.ctrlKey||e.metaKey||e.altKey||!e.key||e.key.length!==1)return;
  var n=Date.now();if(n-last>2000)buf="";last=n;
  buf=(buf+e.key.toLowerCase()).slice(-6);if(buf==="dukaan")go()});
})();
